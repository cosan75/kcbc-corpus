ions": ["분산", "중단", "집중", "회피"], "answer": "③", "meaning": "도전 81일차 월22일 3 이야기 집중은 ‘한 가지 일에 모든 힘을 쏟아부음’이란 뜻을 가지고 있어요.", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:mar-23", "concept": "참여", "kind": "item", "genre": "이야기", "technique": "3지선다", "origin": "source", "date": "3월 23일", "prompt": "다음 중 그림 그리기 대회에 ’참여’하는 행동은 무엇인가요?", "passage": "일함’이란 뜻을 가지고 있어요. 그 순간에 자리에만 있는 것이 아니라 행동으로 함께 할 때 참여했다고 할 수 있어요. 비슷한 말로는 ‘참가’와 ‘참석’ 같은 말이 있어요.", "options": ["그림을 직접 그림", "멀리서 보기만 함", "집에서 잠을 자고 있음"], "answer": "② 아니요 ③ 아니요", "meaning": "참여는 ‘여러 사람이 같이하는 어떤 일에 끼어들어 함께 일함’이란 뜻을 가지고 있어요.", "synonyms": ["참가", "참석"], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:mar-24", "concept": "지속", "kind": "item", "genre": "이야기", "technique": "4지선다", "origin": "source", "date": "3월 24일", "prompt": "’지속’의 뜻으로 가장 알맞은 것은 무엇인가요?", "passage": "계속됨’을 의미해요. 이야기 속 주민들처럼 약속한 것을 한 번으로 끝내지 않고 지속할 때 긍정적인 습관이 형성되어요. 축제가 끝난 뒤에도 주민들은 약속했어요. “이번처럼 서로 존중하고, 거짓을 사실인 양 퍼뜨리지 않는 태도를 앞으로도 지속하자.”", "options": ["잠시 하다 그만두는 것", "한 번만 실천하는 것", "중간에 바꾸는 것", "오래도록 이어가는 것"], "answer": "④", "meaning": "\"물가 상승의 지속\"처럼 지속은 ‘어떤 일이나 상태가 오래 계속됨’을 의미해요.", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:mar-25", "concept": "지원", "kind": "item", "genre": "이야기", "technique": "4지선다", "origin": "source", "date": "3월 25일", "prompt": "앵커가 말하는 ’지원’의 의미로 가장 알맞은 것은 무엇인가요?", "passage": "여름철에 비가 많이 와서 농작물 피해가 심각한 곳을 지원하자는 뉴스 기사를 본 적이 있나요? 지원은 ‘물건이나 행동으로 ‘뒷받침’ 같은 말이 있어요. “9시 뉴스입니다. 처음 그림 그리기 축제에 참여하는 주민들을 위해 붓과 물감, 물통, 도화지 등의 재료를 지원 받았습니다.”", "options": ["규칙을 정함", "도움을 줌", "평가를 함", "제한을 둠"], "answer": "②", "meaning": "지원은 ‘물건이나 행동으로 도움’이란 뜻을 가지고 있어요.", "synonyms": ["후원", "지지", "뒷받침"], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:mar-26", "concept": "정상", "kind": "item", "genre": "이야기", "technique": "3  표현하여 이해를 돕는 것", "말에 재미있는 이야기를 계속 덧붙이는 것", "어려운 단어를 사용해 멋있게 보이게 하는 것"], "answer": "②", "meaning": "간결성은 꼭 ‘필요한 내용만 골라 군더더기 없이 간단하고 깔끔하게 전하는 것’을 말해요.", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:mar-30", "concept": "간략하게", "kind": "item", "genre": "제재/소재", "technique": "4지선다", "origin": "source", "date": "3월 30일", "prompt": "내용을 짧고 간단하게 정리하는 것을 의미하는 빈칸에 들어갈", "passage": "글을 쓸 때 꼭 필요한 내용만 골라 짧게 정리한 글을 본 적 있지요. 간략하다는 말은 ‘내용을 길게 늘이지 않고 핵심만 담아 알기 쉽게 표현하는 것’을 뜻해요. 이렇게 쓰면 읽는 사람이 단어가 있어요. 알맞은 단어는 무엇인가요? “선생님은 긴 설명을 ________ 줄여 주셨다.”", "options": ["자세하게", "간략하게", "어렵게", "재미있게"], "answer": "②", "meaning": "간략하다는 말은 ‘내용을 길게 늘이지 않고 핵심만 담아 알기 쉽게 표현하는 것’을 뜻해요.", "synonyms": ["간단하다", "줄이다"], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:mar-31", "concept": "간접", "kind": "item", "genre": "제재/소재", "technique": "2지선다", "origin": "source", "date": "3월 31일", "prompt": "빈칸에 들어갈 알맞은 단어는 무엇인가요?", "passage": "책을 읽거나 영상을 보며 직접 하지 않아도 알게 되는 경우가 있지요. 간접은 이렇게 ‘어떤 일을 바로 하지 않고, 다른 방법이나 수단을 통해 경험하거나 아는 것’을 말해요. 직접 해 보는 것과 달리 이런 과정이 필요하고, ‘직접’은 간접의 반대말이에요. “오늘은 실험을 하지 않고 영상으로 실험 과정을 보며, ________적으로 경험할 겁니다.”", "options": ["직접", "간접"], "answer": "②", "meaning": "간접은 이렇게 ‘어떤 일을 바로 하지 않고, 다른 방법이나 수단을 통해 경험하거나 아는 것’을 말해요.", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:apr-01", "concept": "감각", "kind": "item", "genre": "제재/소재", "technique": "4지선다", "origin": "source", "date": "4월 1일", "prompt": "다음 중 ’감각’을 사용한 예가 아닌 것은 무엇인가요?", "passage": "우리는 눈으로 보고 귀로 듣는 등 여러 감각을 사용해 세상을 느껴요. 감각은 ‘눈, 코, 귀, 혀, 피부로 자극을 받아 알아차리는 것’을 말해요. 감각이 예민하면 작은 차이도 잘 느끼고 표현할 수 있고, 둔감하면 잘 느끼지 못해요.", "options": ["지저귀는 새소리가 들렸다.", "달콤한 딸기 맛이 느껴졌다.", "수학 문제를 혼자 계산했다.", "향긋한 꽃향기가 코에 스며들었다."], "answer": "③", "meaning": "감각은 ‘눈, 코, 귀, 혀, 피부로 자극을 받아 알아차리는 것’을 말해요.", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:apr-02", "concept": "강력", "kind": "item", "genre": "제재/소재", "technique": "4지선다", "origin": "source", "date": "4월 2일", "prompt": "다음 문장에서 ’강력’은 어떤 뜻인가요?", "passage": "작품을 만들 때 한 번 붙였는데도 잘 떨어진 적 있지요. 강력은 ‘힘이나 영향이 아주 센 상태’를 말해요. 튼튼함이나 강함과 비슷한 뜻이고, 오래 유지되어 쉽게 흔들리지 않아요. 반대로 ‘약하다’는 강력과 반대되는 말이에요. “이 접착제는 강력한 힘으로 나무를 단단히 붙인다.”", "options": ["약하게 붙인다.", "냄새가 강하다.", "천천히 굳는다.", "힘이 세다."], "answer": "④", "meaning": "강력은 ‘힘이나 영향이 아주 센 상태’를 말해요.", "synonyms": [], "antonyms": ["약하다"], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:apr-03", "concept": "강제", "kind": "item", "genre": "제재/소재", "technique": "4지선다", "origin": "source", "date": "4월 3일", "prompt": "다음 중 ’강제’ 상황에 해당하는 것은 무엇인가요?", "passage": "때로는 하고 싶지 않은 일을 억지로 해야 했던 적 있지요. 만드는 것’을 말해요. ‘강박’이나 ‘강요’와 비슷한 뜻이에요.", "options": ["“청소하고 싶은 사람 손 들기!”", "“모두 억지로 이 일을 해야 해. 싫어도 해!”", "“하고 싶은 활동을 직접 선택하세요.”", "“서로 바꾸고 싶으면 바꿔도 됩니다.”"], "answer": "②", "meaning": "강제는 ‘다른 사람이 원하지 않는데도 힘이나 규칙으로 꼭 하게 만드는 것’을 말해요.", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:apr-04", "concept": "강조", "kind": "item", "genre": "제재/소재", "technique": "4지선다", "origin": "source", "date": "4월 4일", "prompt": "다음 중 ’강조’가 필요한 상황은 무엇인가요?", "passage": "선생님이 같은 말을 다시 말하며 조심하라고 할 때가 있지요. 라는 단어가 있어요.", "options": ["혼자 책을 읽을 때", "조용히 그림을 그릴 때", "중요한 규칙이나 안전 수칙을 말할 때", "친구에게 농담을 말할 때"], "answer": "③", "meaning": "강조는 특히 ‘중요한 내용을 더 강하게 말하거나 여러 번 되풀이 해 전하는 것’을 말해요.", "synonyms": ["주장", "부각", "역설"], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:apr-05", "concept": "청명", "kind": "info", "genre": "절기", "technique": "기타", "origin": "source", "date": "4월 5일", "prompt": "봄이 한층 더 짙어지고 자연이 맑아지는 절기인 ‘청명’을 알아봅시다.", "passage": "청명은 24절기 중 다섯 번째 절기로, 양력 4월 4~6일경에 해당해요. 봄기운이 완전하게 퍼져 하늘이 맑고 밝아지는 시기예요. 이때부터 농사 준비가 본격적으로 이루어지고, 조상님께 성묘하는 풍습도 이어져 온 절기예요.", "options": [], "answer": "", "meaning": "", acherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:may-02", "concept": "(미상)", "kind": "item", "genre": "제재/소재", "technique": "4지선다", "origin": "source", "date": "5월 2일", "prompt": "긍정적인 태도를 나타내는 말은 무엇인가요?", "passage": "라고 해요. 잘할 수 있다고 믿거나 좋은 면을 먼저 보는 마음이지 ‘부정’이 있어요. 긍정적인 마음을 가지면 도전할 힘이 생기고 다른 사람에게도 좋은 영향을 줄 수 있어요. \"앞으로 좋은 성적을 받을 수 없을거야.\" \"난 왜 저 친구처럼 잘 하지 못할까?\" \"함께 하면 할 수 있어. 우리 같이 해보자!\" \"난 관심 없어.\"", "options": ["", "", "", ""], "answer": "③", "meaning": "‘어떤 일이나 생각을 좋게 바라보고 받아들이는 태도’를 긍정이 라고 해요.", "synonyms": ["승인", "동의", "수긍", "부정"], "antonyms": ["부정"], "needsTeacherReview": true, "notes": ["개념어 자동추출 실패 — 확인 필요", "자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:may-03", "concept": "(미상)", "kind": "item", "genre": "미상", "technique": "기타", "origin": "source", "date": "5월 3일", "prompt": "✓ 표시를 해 봅시다.", "passage": "기능은 ‘작업을 정확하고 손쉽게 해주는 기술적인 재주와 능력’ 이라는 의미를 갖고 있어요. 사람에게는 저마다 뛰어난 기능이 있 어요. 운동을 잘하는 사람은 몸의 기능이 뛰어나고, 그림을 잘 그 리는 사람은 손의 기능이 뛰어나요. 친구의 말을 잘 들어 주는 사 람은도 마음의 기능이 뛰어난 것이에요. ’기능[技能]’에 대한 설명을 읽고, 자신에게 해당하는 곳에 달리기와 같은 체육 활동 때 몸을 그림을 그리고 만들기를 잘함. 친구의 이야기를 들어 주고 공감을", "options": [], "answer": "", "meaning": "", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["개념어 자동추출 실패 — 확인 필요", "장르 미상", "정답 미검출", "자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:may-04", "concept": "(미상)", "kind": "item", "genre": "제재/소재", "technique": "2지선다", "origin": "source", "date": "5월 4일", "prompt": "다음 중 ’기능[機能]’의 의미가 가장 잘 드러난 문장은?", "passage": "기능은 ‘어떤 역할을 맡아 수행하는 것’ 또는 ‘권한이나 능력에 따라 담당하게 되는 역할’이라는 의미를 갖고 있어요. 시청은 주민 의 생활을 편리하게 하고 도시를 관리하는 기능, 경찰서는 범죄를 예방하고 시민의 안전을 지키는 기능, 학교는 학생들이 배우고 성 우리 주변에 공공기관은 각자의 기능을 하며 우리가 안전하고 행복하게 살도록 돕습니다. 우리 주변 공공기관 도서관은 더운 날 에어컨을 틀어줍니다. 소방서는 화재를 예방하고 사람을 구한다.", "options": ["", ""], "answer": "②", "meaning": "", "synonyms": ["역할", "성능"], "antonyms": [], "needsTeacherReview": true, "notes": ["개념어 자동추출 실패 — 확인 필요", "자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:may-05", "concept": "입하", "kind": "info", "genre": "절기", "te 원본 대조 확인 필요"]}, {"uid": "src:jun-20", "concept": "배열", "kind": "item", "genre": "설명문", "technique": "단답", "origin": "source", "date": "6월 20일", "prompt": "아래 키보드 자판의 ’배열’을 살펴보고 빠진 부분을 채워봅시다.", "passage": "예를 들어, 학교 운동장에서 친구들이 키가 작은 순서대로 줄을 서거나, 미술 시간에 예쁜 색깔 블록들을 빨강, 노랑, 파랑 순서로 나란히 놓는 것도 모두 배열이라고 할 수 있어요. 키보드 자판은 키들이 일정한 배열 규칙에 따라 줄지어 배치되어 있어요. 키보드의 키들은 'ㄱ, ㄴ, ㄷ...' 또는 'Q, W, E, R, T, Y...' 같은 정해진 순서와 위치에 놓여 있어요. 이 배열 덕분에 우리는 자판을 익힌 후에는 원하는 키를 눈으로 찾지 않고도 빠르게 자판을 누를 수 있어요.", "options": [], "answer": "ㅗ", "meaning": "배열은 ‘일정한 순서나 간격으로 쭉 벌여 놓음’을 뜻해요.", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:jun-21", "concept": "하지", "kind": "info", "genre": "절기", "technique": "기타", "origin": "source", "date": "6월 21일", "prompt": "24절기 중 낮이 가장 긴 절기인 ’하지’를 알아봅시다.", "passage": "하지는 '여름에 이르렀다'는 뜻으로, 일 년 중 낮의 길이가 가장 길고 밤의 길이가 가장 짧은 날이에요! 학교에 일찍 와도 해가 떠 있고, 밤늦게까지 밖이 환하게 보여요. 이 날 이후부터 해가 뜨는 시간이 조금씩 짧아지기 시작해요.", "options": [], "answer": "", "meaning": "", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:jun-22", "concept": "배출", "kind": "item", "genre": "설명문", "technique": "3지선다", "origin": "source", "date": "6월 22일", "prompt": "다음 중 ’배출’의 의미가 다른 것을 고르세요.", "passage": "배출은 두 가지 뜻이 있어요. 첫 번째 뜻은 ‘안에서 밖으로 밀어냄’이에요. 공장 굴뚝에서 나쁜 연기가 하늘 밖으로 나오는 것이나, 자동차에서 매연이 나오는 것처럼 말이죠. 두 번째 뜻은 동물이 섭취한 음식물을 소화하여 항문으로 내보내는 일을 말해요. 우리가 대변을 보는 것도 배출이랍니다. 잎은 산소를 배출한다. 화장실에서 대변을 배출했다. 자동차에서 많은 매연이 배출된다. 산소를 배출하는 잎의 특별한 능력 식물의 잎은 햇빛을 받아 우리가 배출하는 이산화탄소를 빨아들이고 산소를 배출해요. 식물이 산소를 배출해 주기 때문에, 우리는 맑은 공기를 마시며 건강하게 살 수 있는 것이에요.", "options": ["", "", ""], "answer": "②", "meaning": "배출은 두 가지 뜻이 있어요.", "synonyms": [], "antonyms": [], "needsTeacherReview": true, "notes": ["자동 파싱(2~12월) — 원본 대조 확인 필요"]}, {"uid": "src:jun-23", "concept": "(미상)", "kind": "item", "genre": "대화문", "technique": "단답", "origin": "source", "date": "6월 23일", "prompt": "다음 대화에서 괄호를 채워봅시다.", "passage": "의미합니다. 예를 들어 선생님께서 시험 ], "antonyms": [], "needsTeacherReview": false, "notes": []}, {"uid": "src:jan-11", "concept": "능력", "kind": "item", "genre": "광고", "technique": "4지선다", "origin": "source", "date": "1월 11일", "prompt": "다음에서 말하는 '능력'의 의미로 가장 알맞은 것은 무엇인가요?", "passage": "문제를 스스로 해결하거나 새로운 일을 잘 해낼 때 그 사람의 힘이 드러나요.", "options": ["태어날 때부터 정해진 재능", "남보다 뛰어난 결과", "어떤 일을 해낼 수 있는 힘과 가능성", "시험 점수로 나타나는 점수"], "answer": "③", "meaning": "어떤 일을 할 수 있는 힘이나 자질. 지식과 경험을 바탕으로 행동을 이루는 힘.", "synonyms": ["실력", "역량", "재주"], "antonyms": [], "needsTeacherReview": false, "notes": []}, {"uid": "src:jan-12", "concept": "단순", "kind": "item", "genre": "설명문", "technique": "OX", "origin": "source", "date": "1월 12일", "prompt": "다음 문장이 지문의 내용과 같으면 O, 다르면 X를 하세요.", "passage": "어떤 화가들은 사물을 그대로 그리지 않고 기본 모양과 몇 가지 색으로 단순하게 표현합니다. 겉보기에 쉬운 그림 같지만 화가의 생각을 더 분명히 드러내고 보는 사람이 상상할 여지를 남깁니다.", "options": ["단순한 그림은 화가의 생각이 잘 드러나지 않는다.", "단순한 표현은 보는 사람의 상상력을 키워 줄 수 있다.", "지문에서는 단순한 그림이 쉬운 그림이라고만 말하고 있다."], "answer": "① X / ② O / ③ X", "meaning": "모양이나 내용이 복잡하지 않고 알기 쉬움. 불필요한 것을 빼고 꼭 필요한 것만 남긴 상태.", "synonyms": ["단일"], "antonyms": ["복합"], "needsTeacherReview": false, "notes": []}, {"uid": "src:jan-13", "concept": "목적", "kind": "item", "genre": "보고서", "technique": "4지선다", "origin": "source", "date": "1월 13일", "prompt": "이 실험에서 '실험 목적'이 의미하는 것은 무엇인가요?", "passage": "실험 제목: 식물의 성장 환경 비교 / 실험 목적: 햇빛의 양이 식물의 성장 속도에 어떤 영향을 주는지 알아본다. / 실험 방법: 같은 식물 둘을 창가·어두운 방에 두고 7일간 기록.", "options": ["실험 중간에 꼭 지켜야 할 규칙", "실험이 끝난 뒤 결과를 설명하는 것", "실험 방법을 복잡하게 만드는 부분", "실험을 하는 까닭이자 실험을 통해 이루고 싶은 것"], "answer": "④", "meaning": "어떤 일을 하는 까닭이자, 그 일을 통해 이루고 싶은 것.", "synonyms": ["목표", "의도", "취지", "타깃"], "antonyms": [], "needsTeacherReview": false, "notes": []}, {"uid": "src:jan-14", "concept": "문제", "kind": "item", "genre": "안내문", "technique": "4지선다", "origin": "source", "date": "1월 14일", "prompt": "다음 중 지문의 문제와 같은 의미로 사용된 문장은 무엇인가요?", "passage": "충남초등학교 안내장: 최근 학교 주변에 버려진 일회용 컵이 큰 문제가 되고 있습니다. 텀블러 사용 등 작은 습관부터 시작해야 합니다.", "options": ["교실 청결은 모두가 함께 해결해야 할 문제이다.
